<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Collections — BLOOMS by Aditi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="collections">
  <div id="site-header"></div>

  <main>
    <section class="page-banner ph" data-img="banner-collections.jpg">
      <div>
        <h1 id="bannerTitle">Our Collections</h1>
        <p class="script" id="bannerSub">Six creative collections. Endless possibilities.</p>
      </div>
    </section>

    <section class="section" id="allCollections">
      <div class="container">
        <div class="collections-page-grid" id="colGrid"></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-title"><h2 id="shopTitle">Shop All</h2></div>
        <div class="toolbar">
          <div class="chips" id="chips"></div>
          <select class="sort" id="sort" aria-label="Sort products">
            <option value="featured">Sort by: Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="az">Name: A–Z</option>
          </select>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
        <p class="empty" id="noResults" hidden>No products match your search.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script>
    window.pageInit = () => {
      const params = new URLSearchParams(location.search);
      let active = params.get("c") || "all";
      const q = (params.get("q") || "").toLowerCase().trim();

      document.getElementById("colGrid").innerHTML = COLLECTIONS.map((c, i) => collectionCard(c, i)).join("");

      const chips = document.getElementById("chips");
      chips.innerHTML = `<button class="chip" data-c="all">All</button>` +
        COLLECTIONS.map((c) => `<button class="chip" data-c="${c.id}">${c.name.replace(" Collection", "")}</button>`).join("");

      const render = () => {
        chips.querySelectorAll(".chip").forEach((b) => b.classList.toggle("active", b.dataset.c === active));
        let list = PRODUCTS.filter((p) => (active === "all" || p.col === active) && (!q || p.name.toLowerCase().includes(q)));
        const s = document.getElementById("sort").value;
        if (s === "low") list.sort((a, b) => a.price - b.price);
        if (s === "high") list.sort((a, b) => b.price - a.price);
        if (s === "az") list.sort((a, b) => a.name.localeCompare(b.name));
        document.getElementById("shopGrid").innerHTML = list.map((p) => productCard(p, { addBtn: true })).join("");
        document.getElementById("noResults").hidden = list.length > 0;
        const col = COLLECTIONS.find((c) => c.id === active);
        document.getElementById("shopTitle").textContent = q ? `Results for “${q}”` : col ? col.name : "Shop All";
        if (col) {
          document.getElementById("bannerTitle").textContent = col.name;
          document.getElementById("bannerSub").textContent = col.tag;
        }
        loadImages();
      };
      chips.addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        active = b.dataset.c; render();
      });
      document.getElementById("sort").addEventListener("change", render);
      render();
      // When arriving on a specific collection or search, skip the overview grid
      if (active !== "all" || q) document.getElementById("allCollections").hidden = true;
    };
  </script>
</body>
</html>
